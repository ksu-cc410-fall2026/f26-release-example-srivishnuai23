[metadata]
name = guessinggame
version = 0.0.1
authors = Srivishnu Chandramouli
author_email = svchandr@ksu.edu
description = A fun guessing guessinggame
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/ksu-cc410-fall2026/f26-release-example-srivishnuai23
project_urls = 
